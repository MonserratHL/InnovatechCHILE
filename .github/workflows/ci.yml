name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  front-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout repository (git clone)
        uses: actions/checkout@v4

      - name: Setup node (instalar node)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Instalar las dependencias
        run: npm install --legacy-peer-deps

      - name: Construir la aplicación
        run: npm run build

  back-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: innovatechdb
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository (git clone)
        uses: actions/checkout@v4

      - name: Setup Java (instalar java)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verificar estructura del proyecto
        run: |
          if [ ! -f "pom.xml" ]; then
            echo "❌ Error: pom.xml no encontrado"
            exit 1
          fi

      # FIXED: Increased MySQL startup timeout from 60 to 300 seconds (5 minutes)
      - name: Esperar a que MySQL esté listo
        run: |
          for i in {1..300}; do
            if mysqladmin ping -h"127.0.0.1" -uroot -proot --silent 2>/dev/null; then
              echo "✅ MySQL está listo en intento $i"
              exit 0
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "⏳ Esperando MySQL... (intento $i/300)"
            fi
            sleep 1
          done
          echo "❌ MySQL no está disponible después de 5 minutos"
          exit 1

      - name: Crear esquema de base de datos
        run: |
          mysql -h"127.0.0.1" -uroot -proot innovatechdb << 'EOF'
          CREATE TABLE IF NOT EXISTS users (
            id INT AUTO_INCREMENT PRIMARY KEY,
            name VARCHAR(100),
            email VARCHAR(100),
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          INSERT INTO users (name, email) VALUES ('Test User', 'test@innovatech.cl');
          EOF

      - name: Ejecutar pruebas backend
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/innovatechdb
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root

  back-build:
    runs-on: ubuntu-latest
    needs: back-test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository (git clone)
        uses: actions/checkout@v4

      - name: Setup Java (instalar java)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Instalar cliente MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-client  

      - name: Construir la aplicación backend
        run: mvn clean package -DskipTests

      
      
      # FIXED: Changed JAR pattern to match finalName in pom.xml
      - name: Verificar artefacto generado
        run: |
          if [ -f "target/innovatech-api-1.0.0.jar" ]; then
            echo "✅ JAR compilado exitosamente"
            ls -lh target/backend.jar
          else
            echo "❌ JAR no encontrado en target/"
            ls -la target/ || true
            exit 1
          fi

